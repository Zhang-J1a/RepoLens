name: RepoLens V6 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked optional LangChain environment
        run: |
          python -m pip install -r apps/api/requirements-langchain.lock
          python -m pip install . --no-deps
          python -m pip check
      - name: Test LangChain adapters without provider requests
        env:
          PYTHONPATH: src
        run: |
          python -c "import langchain_core, langchain_deepseek"
          python -m unittest discover -s tests -p test_langchain_integration.py -v
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --no-index --find-links dist repolens
      - name: Check prerequisites
        run: repolens doctor
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src tests experiments scripts
      - name: Offline installed-package demo
        run: python scripts/demo.py
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install workbench test dependencies
        run: |
          python -m pip install -r apps/api/requirements-web.lock
          python -m pip install . --no-deps
          npm ci --prefix apps/web
      - name: Type check and build the six-page workbench
        run: |
          npm run format:check --prefix apps/web
          npm run build --prefix apps/web
      - name: Build and verify the installed V6 wheel
        env:
          PYTHONPATH: src
        run: |
          python -m pip install setuptools
          python scripts/build_release.py --output eval/v6-package-build.json
          python -m pip install --force-reinstall --no-deps dist/repolens-4.1.0-py3-none-any.whl
          python -I scripts/workbench_demo.py --output eval/v6-workbench-smoke.json
      - name: Test typed local API
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_workbench.py -v
          python -m unittest discover -s tests -p test_v6.py -v
          python scripts/export_api.py --check
          npm run api:types --prefix apps/web
          git diff --exit-code -- apps/web/src/api-schema.d.ts
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser workflows and narrow-screen checks
        working-directory: apps/web
        env:
          CI: "true"
          PYTHONPATH: src
        run: npm test
      - name: Frozen evaluation regression gate
        env:
          PYTHONPATH: src
        run: python scripts/v6_regression.py
      - name: Build V6 container image
        run: docker build --tag repolens:v6 .
      - name: Select a free loopback port for Compose
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(f"REPOLENS_HOST_PORT={listener.getsockname()[1]}")
          PY
      - name: Test fresh container startup with the built-in Demo
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120
          python scripts/container_smoke.py --url "http://127.0.0.1:${REPOLENS_HOST_PORT}"
      - name: Prepare a synthetic authorized mount
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from repolens.workbench.service import WorkbenchService
          demo = WorkbenchService(Path("data/container-fixture")).demo()
          Path(demo["repository"]).chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("REPOLENS_REPOSITORY_PATH=" + demo["repository"] + "\n")
          PY
      - name: Test the optional read-only mount
        run: |
          docker compose -f docker-compose.yml -f compose.repository.yml config --quiet
          docker compose -f docker-compose.yml -f compose.repository.yml up -d --wait --wait-timeout 120
          docker compose exec -T repolens git --no-pager -c safe.directory=/workspace/repository -c core.fsmonitor=false -c gc.auto=0 -c maintenance.auto=false -C /workspace/repository rev-parse --show-toplevel
          docker compose exec -T repolens git --no-pager -c safe.directory=/workspace/repository -c core.fsmonitor=false -c gc.auto=0 -c maintenance.auto=false -C /workspace/repository rev-parse --absolute-git-dir
          docker compose exec -T repolens git --no-pager -c safe.directory=/workspace/repository -c core.fsmonitor=false -c gc.auto=0 -c maintenance.auto=false -C /workspace/repository show -s --format=%H HEAD
          python scripts/container_smoke.py --url "http://127.0.0.1:${REPOLENS_HOST_PORT}" --repository /workspace/repository
          docker inspect "$(docker compose ps -q repolens)" --format '{{json .Mounts}}' > data/container-mounts.json
          python -c 'import json; rows=json.load(open("data/container-mounts.json")); assert any(row["Destination"] == "/workspace/repository" and not row["RW"] for row in rows)'
      - name: Stop container
        if: always()
        run: docker compose -f docker-compose.yml down
